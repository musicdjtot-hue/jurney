name: Build Android 17 APK (Poco F6)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build latest standalone game bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          node scripts/build-standalone.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            set +o pipefail
            yes | "$SDK_MANAGER" --licenses >/dev/null || true
            "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: android-apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK for Poco F6
        uses: actions/upload-artifact@v4
        with:
          name: CoruscantHorizon-Android17-PocoF6-debug
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
